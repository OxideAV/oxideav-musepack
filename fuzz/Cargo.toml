[package]
name = "oxideav-musepack-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.oxideav-musepack]
path = ".."

[[bin]]
name = "sv7_file_decode"
path = "fuzz_targets/sv7_file_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sv8_stream_decode"
path = "fuzz_targets/sv8_stream_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sv8_seek_index"
path = "fuzz_targets/sv8_seek_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_roundtrip"
path = "fuzz_targets/encode_roundtrip.rs"
test = false
doc = false
bench = false

# Standalone package: keep the harness out of any enclosing workspace
# (it resolves the library by path and its own oxideav-core from the
# registry).
[workspace]
members = ["."]
